[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dofus-tactical-assistant"
version = "0.1.0"
description = "Passive real-time computer vision tactical assistant for Dofus"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DTA Core Team" }
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "mss>=9.0.1",
    "easyocr>=1.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "pygetwindow>=0.0.9; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12.12",
    "pre-commit>=3.6.0",
]

[project.scripts]
dta = "dta.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
